# ── Регионы — пока НЕ используется (API реестра фильтрует по числовому
# коду региона, который не удалось найти без браузера, см. докстринг
# nostroy.py). Оставлено на будущее.
regions:
  - Санкт-Петербург
  - Ленинградская область
  - Калининградская область
  - Мурманская область
  - Краснодарский край
  - Республика Крым
  - Иркутская область
  - Республика Карелия
  - Забайкальский край
  - Москва

# ── Компании, которых исключаем по названию ──
exclude_customer_keywords:
  - "учреждение"
  - "администрация"
  - "департамент"
  - "министерство"
  - "комитет"
  - "таможня"

# Сколько страниц собрать (без фильтра по региону — общий список членов СРО)
pages: 3
# Записей на страницу
page_size: 50

# ── Токен DaData (тот же принцип, что в остальных приложениях) ──
dadata_token: ""

# ── Прокси на случай блокировки с GitHub Actions ──
proxy: ""

output_file: "nostroy.xlsx"
