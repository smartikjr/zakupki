# ── Регионы для поиска в реестре СРО НОСТРОЙ ──
regions:
  - Санкт-Петербург
  - Ленинградская область
  - Калининградская область
  - Мурманская область
  - Краснодарский край
  - Республика Крым
  - Иркутская область
  - Республика Карелия
  - Забайкальский край
  - Москва

# ── Компании, которых исключаем по названию ──
exclude_customer_keywords:
  - "учреждение"
  - "администрация"
  - "департамент"
  - "министерство"
  - "комитет"
  - "таможня"

# Сколько страниц забирать по каждому региону
pages_per_region: 2

# ── Токен DaData (тот же принцип, что в остальных приложениях) ──
dadata_token: ""

# ── Прокси на случай блокировки с GitHub Actions ──
proxy: ""

output_file: "nostroy.xlsx"
