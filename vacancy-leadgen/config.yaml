# ── Должности, по которым ищем вакансии на hh.ru ──
# Компания, которая сейчас нанимает такого специалиста — обычно ведёт
# стройку прямо сейчас (п.7 методики). Ищутся точно в названии вакансии.
job_titles:
  - Начальник строительного участка
  - Прораб
  - Производитель работ
  - Начальник объекта строительства
  - Инженер ПТО

# ── Регионы ──
# Названия ищутся в дереве регионов hh.ru (сначала точное совпадение,
# потом частичное). Если после запуска в логе видно "не нашёл регион
# hh.ru для ..." — поправь формулировку под то, как регион называется
# на hh.ru (например "Краснодарский край" вместо "Краснодар").
regions:
  - Санкт-Петербург
  - Ленинградская область
  - Калининградская область
  - Мурманская область
  - Краснодарский край
  - Республика Крым
  - Иркутская область
  - Республика Карелия
  - Забайкальский край
  - Москва

# ── Заказчики, которых исключаем по названию ──
# Тот же принцип, что и в основном сборщике лидов (см. корень репозитория
# leadgen.py) — казённые/бюджетные учреждения почти никогда не подходят.
exclude_customer_keywords:
  - "учреждение"
  - "администрация"
  - "департамент"
  - "министерство"
  - "комитет"

# ── Категории для готовых поисковых ссылок (п.9 методики) ──
# Сами результаты поиска НЕ парсятся (см. README) — это просто готовые
# кликабельные ссылки на Яндекс/Google под каждый регион.
search_categories:
  - дорожные строительные компании
  - застройщики
  - нефтегазовые строительные компании

# ── Сколько страниц выдачи hh.ru забирать по каждому запросу (по 50 вакансий на страницу) ──
pages_per_query: 2

# ── Токен DaData (тот же, что и в основном сборщике; можно использовать общий) ──
# Лучше НЕ хранить здесь, а положить в переменную окружения DADATA_TOKEN.
dadata_token: ""

# ── Прокси (на случай если hh.ru окажется недоступен с серверов GitHub Actions) ──
# Пока не требовался — hh.ru не блокирует зарубежные IP так, как
# zakupki.gov.ru. Если понадобится — формат тот же: "http://логин:пароль@хост:порт".
hh_proxy: ""

output_file: "companies.xlsx"
