# ── Ключевые слова для поиска на РТС-тендер (ищутся в предмете закупки) ──
keywords:
  - плиты дорожные
  - плиты аэродромные
  - сваи забивные
  - фундаменты опор ЛЭП
  - опоры ЛЭП
  - лотки теплотрасс
  - кольца колодцев
  - плиты ПАГ
  - ПДН
  - ЖБИ
  - железобетонные изделия
  - перемычки
  - вентиляционные блоки
  - подпорные стенки

# ── Регионы для поиска застройщиков на ЕРЗ.РФ ──
regions:
  - Санкт-Петербург
  - Ленинградская область
  - Калининградская область
  - Мурманская область
  - Краснодарский край
  - Республика Крым
  - Иркутская область
  - Республика Карелия
  - Забайкальский край
  - Москва

# ── Заказчики/застройщики, которых исключаем по названию ──
exclude_customer_keywords:
  - "учреждение"
  - "администрация"
  - "департамент"
  - "министерство"
  - "комитет"
  - "таможня"

# Сколько страниц ленты забирать по каждому запросу
pages_per_keyword: 2
pages_per_region: 2

# ── Токен DaData (тот же принцип, что в остальных приложениях) ──
dadata_token: ""

# ── Прокси на случай блокировки с GitHub Actions (тот же принцип, что
# ZAKUPKI_PROXY/HH_PROXY в других приложениях) ──
proxy: ""

output_file: "erz_rts.xlsx"
