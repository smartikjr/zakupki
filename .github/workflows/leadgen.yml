name: Сбор лидов ЖБИ

on:
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов (UTC)
  workflow_dispatch:          # + кнопка ручного запуска

permissions:
  contents: write             # чтобы коммитить leads.xlsx обратно в репозиторий

jobs:
  leadgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Собрать лиды
        env:
          DADATA_TOKEN: ${{ secrets.DADATA_TOKEN }}
          ZAKUPKI_PROXY: ${{ secrets.ZAKUPKI_PROXY }}
        run: python leadgen.py

      # Вариант А: скачивать как артефакт запуска
      - uses: actions/upload-artifact@v4
        with:
          name: leads
          path: leads.xlsx

      # Вариант Б: класть свежий файл прямо в репозиторий (открывать откуда угодно)
      - name: Закоммитить результат
        run: |
          git config user.name "leadgen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add leads.xlsx || true
          git commit -m "leads: обновление $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "нет изменений"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "пуш прошёл (попытка $i)"
              exit 0
            fi
            echo "пуш отклонён (попытка $i) — подтягиваю свежую ветку и переношу коммит поверх"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --soft "origin/$GITHUB_REF_NAME"
            git add leads.xlsx || true
            git commit -m "leads: обновление $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "нет изменений для коммита"
            sleep $((i * 3))
          done
          echo "::warning::не удалось запушить leads.xlsx после нескольких попыток"
