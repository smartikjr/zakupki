name: Проверка kad.arbitr.ru (калибровка)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kad-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debt-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Снять debug-HTML и тестовый запрос поиска
        env:
          KAD_PROXY: ${{ secrets.KAD_PROXY }}
        run: |
          python -c "
          import os
          import kad_arbitr
          proxy = os.environ.get('KAD_PROXY') or None
          try:
              kad_arbitr.debug_dump(proxy=proxy)
          except Exception as e:
              print(f'[!] kad debug_dump: {e}')
          try:
              kad_arbitr.debug_dump_search(proxy=proxy)
          except Exception as e:
              print(f'[!] kad debug_dump_search: {e}')
          "

      - name: Закоммитить debug-файлы
        run: |
          git config user.name "leadgen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f debug_kad_* || true
          git commit -m "kad: debug-файлы для проверки капчи и API" || echo "нет изменений"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "пуш прошёл (попытка $i)"
              exit 0
            fi
            git fetch origin "$GITHUB_REF_NAME"
            git reset --soft "origin/$GITHUB_REF_NAME"
            git add -f debug_kad_* || true
            git commit -m "kad: debug-файлы для проверки капчи и API" || echo "нет изменений для коммита"
            sleep $((i * 3))
          done
          echo "::warning::не удалось запушить результат после нескольких попыток"
