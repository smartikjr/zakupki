name: Снять HTML для отладки селекторов

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Ключевое слово для тестового запроса"
        required: false
        default: "плиты дорожные"

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Снять debug-HTML со всех источников
        env:
          KEYWORD: ${{ inputs.keyword }}
          ZAKUPKI_PROXY: ${{ secrets.ZAKUPKI_PROXY }}
        run: |
          python -c "
          import os
          import b2b_center, fabrikant, zakupki

          kw = os.environ.get('KEYWORD') or 'плиты дорожные'
          proxy = os.environ.get('ZAKUPKI_PROXY') or None

          for name, fn in (
              ('b2b-center', lambda: b2b_center.debug_dump(keyword=kw, path='debug_b2b.html', proxy=proxy)),
              ('fabrikant', lambda: fabrikant.debug_dump(keyword=kw, path='debug_fabrikant.html')),
              ('ЕИС', lambda: zakupki.debug_dump(keyword=kw, law=44, path='debug_eis.html', proxy=proxy)),
          ):
              try:
                  fn()
              except Exception as e:
                  print(f'[!] {name}: {e}')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug_*.html
          if-no-files-found: warn

      # Коммитим прямо в репозиторий (не только артефакт) — так проще
      # прочитать без скачивания zip с Azure blob storage.
      - name: Закоммитить debug-HTML
        run: |
          git config user.name "leadgen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f debug_*.html || true
          git commit -m "debug: снят HTML для калибровки селекторов" || echo "нет изменений"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "пуш прошёл (попытка $i)"
              exit 0
            fi
            echo "пуш отклонён (попытка $i) — подтягиваю свежую ветку и переношу коммит поверх"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --soft "origin/$GITHUB_REF_NAME"
            git add -f debug_*.html || true
            git commit -m "debug: снят HTML для калибровки селекторов" || echo "нет изменений для коммита"
            sleep $((i * 3))
          done
          echo "::warning::не удалось запушить debug-HTML после нескольких попыток"
