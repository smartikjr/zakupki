# ── Ключевые слова для поиска закупок (ищутся в предмете закупки) ──
# Подобраны под номенклатуру ГК «БЛОК». Добавляй/убирай под свои задачи.
keywords:
  - плиты дорожные
  - плиты аэродромные
  - сваи забивные
  - фундаменты опор ЛЭП
  - опоры ЛЭП
  - лотки теплотрасс
  - кольца колодцев
  - плиты ПАГ
  - ПДН
  - ЖБИ
  - железобетонные изделия
  - перемычки
  - вентиляционные блоки
  - подпорные стенки

# ── Регионы, которые нас интересуют ──
# Фильтр применяется по адресу заказчика ПОСЛЕ обогащения через DaData.
# Оставь пустым ([]) — чтобы не фильтровать по региону.
target_regions:
  - Санкт-Петербург
  - Ленинградская
  - Калининград
  - Мурманск
  - Краснодар
  - Крым
  - Симферополь
  - Иркутск
  - Карелия
  - Петрозаводск
  - Чита
  - Москва

# ── Источники ──
# zakupki    — ЕИС zakupki.gov.ru (44/223-ФЗ, бюджетные и квази-гос. закупки).
# b2b_center — b2b-center.ru (коммерческие тендеры, НЕ проверено на живых
#              данных — селекторы могут потребовать калибровки, см. b2b_center.py).
# fabrikant  — fabrikant.ru (коммерческие тендеры, тоже не проверено, см. fabrikant.py).
sources: [zakupki, b2b_center, fabrikant]

# ── Заказчики, которых исключаем по названию ──
# Казённые/бюджетные учреждения, администрации и т.п. — по разметке
# руководителя это почти без исключений "не подходит" (чистая бюрократия,
# не прямые покупатели материалов). "Порты" сюда специально не входят —
# порты оставляем. Список можно дополнять.
exclude_customer_keywords:
  - "учреждение"  # казённое/бюджетное/автономное — любое, во всех случаях "не подходит"
  - "администрация"
  - "департамент"
  - "министерство"
  - "комитет"
  - "таможня"
  - "муниципальное унитарное предприятие"

# ── Законы: 44 и/или 223 (только для источника zakupki) ──
laws: [44, 223]

# Сколько страниц ленты ЕИС забирать по каждому ключевику (по 50 записей на страницу)
pages_per_keyword: 2

# ── Токен DaData (бесплатный тариф, 10 000 запросов/день) ──
# Лучше НЕ хранить здесь, а положить в переменную окружения DADATA_TOKEN.
# Если оставить пустым — скрипт возьмёт токен из окружения.
# Без токена скрипт всё равно отработает, но без обогащения (ИНН/адрес/руководитель).
dadata_token: ""

# ── Прокси для запросов к zakupki.gov.ru ──
# zakupki.gov.ru блокирует запросы с зарубежных дата-центровых IP (в т.ч.
# с GitHub Actions runners) — соединение просто виснет по таймауту.
# Нужен прокси с российским IP, формат: "http://логин:пароль@хост:порт"
# (для SOCKS5 — "socks5://..." и пакет pysocks в requirements.txt).
# Лучше НЕ хранить здесь (в URL обычно логин/пароль), а положить в
# переменную окружения ZAKUPKI_PROXY. К DaData прокси не применяется —
# туда запросы всегда идут напрямую.
zakupki_proxy: ""

output_file: "leads.xlsx"
